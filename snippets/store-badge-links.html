<!-- Reusable store badge block (copy into any page). -->
<!-- Replace APP_STORE_URL and PLAY_STORE_URL with real app listing URLs when ready. -->
<div class="store-badge-links" aria-label="Store badges">
  <a
    href="APP_STORE_URL"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Download on the App Store"
  >
    <img
      class="app-store-badge"
      src="/assets/badges/download-on-the-app-store.svg"
      alt="Download on the App Store"
      loading="lazy"
      decoding="async"
    />
  </a>
  <a
    href="PLAY_STORE_URL"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Get it on Google Play"
  >
    <img
      class="play-store-badge"
      src="/assets/badges/google-play-badge.png"
      alt="Get it on Google Play"
      loading="lazy"
      decoding="async"
    />
  </a>
</div>
