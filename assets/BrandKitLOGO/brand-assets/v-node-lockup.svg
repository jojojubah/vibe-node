  <g fill="currentColor" stroke="currentColor" transform="translate(620,120) scale(1.5)">
    <polyline points="196 120 436 760 676 120" fill="none" stroke="currentColor" stroke-width="128" stroke-linecap="butt" stroke-linejoin="bevel" clip-path="url(#v-cut)"/>
    <line x1="760" y1="550" x2="856" y2="438" stroke-width="24" stroke-linecap="round"/>
    <line x1="760" y1="550" x2="890" y2="665" stroke-width="24" stroke-linecap="round"/>
