<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2816 1536" role="img" aria-labelledby="title desc">
  <title id="title">V Node Lockup</title>
  <desc id="desc">Wide logo lockup with V monogram and connected node symbol, transparent background.</desc>
  <defs>
