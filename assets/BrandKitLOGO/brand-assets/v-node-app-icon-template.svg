<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">V Node App Icon Template</title>
  <desc id="desc">Rounded-square icon template with dark gradient background and white V node mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2740"/>
      <stop offset="100%" stop-color="#081523"/>
    </linearGradient>
    <clipPath id="v-cut">
      <rect x="0" y="184" width="740" height="700"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <g fill="#FFFFFF" stroke="#FFFFFF" transform="translate(130,92)">
    <polyline points="196 120 436 760 676 120" fill="none" stroke="#FFFFFF" stroke-width="128" stroke-linecap="butt" stroke-linejoin="bevel" clip-path="url(#v-cut)"/>
    <line x1="760" y1="550" x2="856" y2="438" stroke-width="24" stroke-linecap="round"/>
    <line x1="760" y1="550" x2="890" y2="665" stroke-width="24" stroke-linecap="round"/>
    <circle cx="760" cy="550" r="62"/>
    <circle cx="856" cy="438" r="38"/>
    <circle cx="890" cy="665" r="38"/>
  </g>
</svg>
