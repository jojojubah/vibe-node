    />
    <line x1="760" y1="550" x2="856" y2="438" stroke-width="24" stroke-linecap="round" />
    <line x1="760" y1="550" x2="890" y2="665" stroke-width="24" stroke-linecap="round" />
    <circle cx="760" cy="550" r="62" />
    <circle cx="856" cy="438" r="38" />
    <circle cx="890" cy="665" r="38" />
  </g>
</svg>
