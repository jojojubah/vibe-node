<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Node Mark</title>
  <desc id="desc">White V Node logo mark on transparent background.</desc>
  <defs>
    <clipPath id="v-cut">
      <rect x="0" y="184" width="740" height="700" />
    </clipPath>
  </defs>
  <g fill="#fff" stroke="#fff">
    <polyline
      points="196 120 436 760 676 120"
      fill="none"
      stroke="#fff"
      stroke-width="128"
      stroke-linecap="butt"
      stroke-linejoin="bevel"
